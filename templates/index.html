<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI RAG Assistant</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            resize: none;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 8px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #0072ff;
            color: white;
        }

        .chat-box {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .user {
            background: #0072ff;
            text-align: right;
        }

        .bot {
            background: #444;
            text-align: left;
        }

        .loading {
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🧠 AI RAG Assistant</h2>

    <input type="file" id="pdfFile" accept="application/pdf">
    <button onclick="uploadPDF()">Upload PDF</button>

    <textarea id="question" placeholder="Ask something from your documents..."></textarea>

    <button id="askBtn" onclick="ask()">Ask AI</button>

    <div class="loading" id="loading">⏳ Thinking...</div>

    <div class="chat-box" id="chat"></div>

</div>

<script>
async function ask() {
    let inputBox = document.getElementById("question");
    let button = document.getElementById("askBtn");
    let question = inputBox.value.trim();

    if (!question) return;

    let chat = document.getElementById("chat");

    // show user message
    chat.innerHTML += `<div class="message user">${question}</div>`;

    inputBox.value = "";
    button.disabled = true;
    document.getElementById("loading").style.display = "block";

    try {
        let response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ question: question })
        });

        let data = await response.json();

        document.getElementById("loading").style.display = "none";
        button.disabled = false;

        if (data.error) {
            chat.innerHTML += `<div class="message bot">❌ ${data.error}</div>`;
        } else if (!data.answer || data.answer.includes("I don't know")) {
            chat.innerHTML += `<div class="message bot">🤔 No relevant info found in documents</div>`;
        } else {
            typeText(data.answer);
        }

        scrollToBottom();

    } catch (error) {
        document.getElementById("loading").style.display = "none";
        button.disabled = false;

        chat.innerHTML += `<div class="message bot">❌ Server error</div>`;
        scrollToBottom();
    }
}

// typing animation
function typeText(text) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message bot";
    chat.appendChild(div);

    let i = 0;
    function typing() {
        if (i < text.length) {
            div.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 10);
        }
    }
    typing();
}

// enter key support
document.getElementById("question").addEventListener("keypress", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
    }
});

// auto scroll
function scrollToBottom() {
    let chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}

async function uploadPDF() {
    let fileInput = document.getElementById("pdfFile");
    let file = fileInput.files[0];

    if (!file) {
        alert("Select a PDF first");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    try {
        let res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        let data = await res.json();
        alert(data.message);

    } catch (err) {
        alert("Upload failed");
    }
}







</script>

</body>
</html>
