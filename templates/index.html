<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
}

.wrapper {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 260px;
    background: #020617;
    padding: 20px;
    border-right: 1px solid #1e293b;
}

.sidebar h2 {
    font-size: 18px;
    margin-bottom: 20px;
}

.upload-box {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
}

.upload-box input {
    width: 100%;
    margin-bottom: 10px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 15px;
    border-bottom: 1px solid #1e293b;
    font-weight: 500;
}

.chat {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    max-width: 70%;
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 10px;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #1e293b;
}

.input-box {
    display: flex;
    padding: 15px;
    border-top: 1px solid #1e293b;
}

.input-box textarea {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    resize: none;
    background: #020617;
    color: white;
}

.input-box button {
    margin-left: 10px;
    padding: 10px 15px;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="sidebar">
        <h2>RAG Assistant</h2>

        <div class="upload-box">
            <input type="file" id="pdfFile" accept="application/pdf">
            <button onclick="uploadPDF()">Upload</button>
        </div>

        <button onclick="clearChat()" style="margin-top:20px;width:100%;">Clear Chat</button>
    </div>

    <div class="main">

        <div class="header">
            Document AI Chat
        </div>

        <div class="chat" id="chat"></div>

        <div class="input-box">
            <textarea id="question" placeholder="Ask your document..."></textarea>
            <button onclick="ask()">Send</button>
        </div>

    </div>

</div>

<script>

// Add message
function addMessage(text, type) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// Ask question
async function ask() {
    let input = document.getElementById("question");
    let q = input.value.trim();
    if (!q) return;

    addMessage(q, "user");
    input.value = "";

    addMessage("Thinking...", "bot");
    let loadingMsg = document.querySelector(".bot:last-child");

    try {
        let res = await fetch("/ask", {   // ✅ FIXED
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ question: q })
        });

        let data = await res.json();

        if (data.success) {
            loadingMsg.innerText = data.answer || "No answer";
        } else {
            loadingMsg.innerText = data.error || "Error occurred";
        }

    } catch {
        loadingMsg.innerText = "Server error";
    }
}

// Upload PDF
async function uploadPDF() {
    let file = document.getElementById("pdfFile").files[0];

    if (!file || file.type !== "application/pdf") {
        return alert("Please select a valid PDF file");
    }

    let formData = new FormData();
    formData.append("file", file);

    try {
        let res = await fetch("/upload", {   // ✅ FIXED
            method: "POST",
            body: formData
        });

        let data = await res.json();

        if (data.success) {
            alert(data.message || "Upload successful");
        } else {
            alert(data.error || "Upload failed");
        }

    } catch {
        alert("Server error");
    }
}

// Clear chat
function clearChat() {
    document.getElementById("chat").innerHTML = "";
}

// Enter to send
document.getElementById("question").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ask();
    }
});
</script>

</body>
</html>
